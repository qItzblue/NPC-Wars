# Built-in kits (the fallback kit system used when no other kit plugin is installed).
#
# Each entry in "items" is either
#   - a text line:   MATERIAL [amount] [enchantment:level ...]      e.g. DIAMOND_SWORD sharpness:3 unbreaking:2
#   - or "base64:<data>", written by "/npcwars kit create <name>" (keeps names, lore, trims, ...).
#
# A kit fills a whole player inventory: armor goes to the armor slots, a shield to the off hand, the strongest melee
# weapon to hotbar slot 0, and everything else (food, pearls, wind charges, arrows, potions, blocks...) to the other
# hotbar and storage slots, with the amounts you give. Fighting NPCs use what they carry (see combat: in config.yml).
# Potions take potion:<type> (healing, strong_healing, harming, strength, swiftness, ...). Create, list and delete kits in game with /npcwars kit create|list|delete,
# or edit this file and run /npcwars reload.
kits:
  leather:
    icon: LEATHER_CHESTPLATE
    items:
      - LEATHER_HELMET
      - LEATHER_CHESTPLATE
      - LEATHER_LEGGINGS
      - LEATHER_BOOTS
      - WOODEN_SWORD
