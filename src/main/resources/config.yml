# NPC-Wars configuration.
# Saved NPCs, their equipment and the teams live in data.yml (managed by the plugin, do not edit while running).
# Built-in kits live in kits.yml. After editing this file run /npc reload.

npc:
  # Show the NPC's name above its head. Team names are never shown, whatever this is set to.
  show-nametag: true
  # NPCs take no damage outside of a running fight (staff can still /kill them).
  invulnerable-when-idle: true
  # Hard limit on saved NPCs.
  max-npcs: 500
  # Player name whose skin new NPCs wear (blank = the default Mannequin skin). Per NPC: /npc skin <id> <player>.
  default-skin: ""
  max-health: 20.0
  # An NPC that dies outside of a fight comes back at its home position after this many seconds.
  idle-respawn-delay-seconds: 3

# NPCs have no vanilla AI, so the plugin moves them. Speeds are blocks per tick (20 ticks = 1 second).
movement:
  walk-speed: 0.215
  sprint-speed: 0.28
  sneak-speed: 0.065
  swim-speed: 0.14
  # After being hit, the NPC's own movement pauses this many ticks so knockback is visible.
  knockback-grace-ticks: 6
  # Jump automatically over one-block obstacles while walking.
  auto-jump: true

pathfinding:
  enabled: true
  # Cap on cells examined per search; bounds the cost of one path.
  max-nodes: 1500
  # Searches stay inside this many blocks around the NPC.
  max-range: 64
  # Time budget for ALL path searches per server tick, in microseconds. Extra requests wait for the next tick.
  budget-micros-per-tick: 1500
  # Block lookups are cached for this many ticks.
  cache-ttl-ticks: 100
  # An NPC asks for a new path at most this often.
  repath-interval-ticks: 20
  # 1.0 = shortest paths; higher = faster searches, slightly longer paths.
  heuristic-weight: 1.3
  # Largest drop (in blocks) an NPC will plan to jump down.
  max-drop: 3

fight:
  # How far an NPC looks for enemies (blocks). 0 = unlimited.
  target-radius: 64
  # How often each NPC re-checks for a closer enemy. Searches are staggered across NPCs.
  retarget-interval-ticks: 10
  # How often the spatial index of fighters is rebuilt.
  grid-refresh-ticks: 4
  # Melee reach in blocks (measured to the target's hitbox).
  attack-reach: 3.0
  # Sprint towards targets that are further away than this.
  sprint-distance: 6.0
  # A new target replaces the current one only if it is closer than this fraction of the current distance.
  switch-target-factor: 0.6
  # What NPCs without a team do: FREE_FOR_ALL (fight everybody, each is its own side) or IDLE (stand still, but can
  # still be attacked by the teams).
  unteamed-npcs: FREE_FOR_ALL
  # Players are valid targets (members of other teams, and anyone without a team).
  target-players: true
  ignore-creative-players: true
  # Allow damage between members of the same team (only affects fights involving NPCs).
  friendly-fire: false
  # An NPC that is hit by an enemy may switch to the attacker.
  retaliate: true
  # End the fight automatically when at most one side is left.
  auto-end: true
  # What happens to an NPC that dies in a fight:
  #   RESPAWN_ON_FIGHT_END - stays down until the fight ends, then returns at its home position
  #   RESPAWN_DELAY        - returns after respawn-delay-seconds and rejoins the fight
  #   REMOVE               - deleted permanently
  on-death: RESPAWN_ON_FIGHT_END
  respawn-delay-seconds: 10
  heal-on-start: true
  heal-on-end: true
  # Multiplier applied to every NPC hit.
  damage-multiplier: 1.0
  critical-hits: true
  # Lower bound for the time between hits, whatever the weapon.
  min-attack-cooldown-ticks: 4
  # Fighting that is not robotic: most swings connect, some miss, and sometimes an NPC pauses before swinging again.
  hit-chance: 0.85
  hesitate-chance: 0.12
  hesitate-min-ticks: 4
  hesitate-max-ticks: 14
  attack-jitter-ticks: 2
  # An NPC with an empty main hand picks this up when a fight starts, so it visibly holds a weapon (NONE = leave empty).
  default-weapon: STONE_SWORD
  require-line-of-sight: true
  # Who sees countdown and result announcements: ALL players, only STAFF (npcplugin.notify), or NONE.
  announce: ALL
  # Seconds before a scheduled fight at which a countdown message is sent.
  countdown-marks: [60, 30, 10, 5, 4, 3, 2, 1]

massaction:
  # The "attack" action really hurts the enemy in front of the NPC (false = swing animation only).
  attack-deals-damage: true
  # Allow /massaction while a fight is running (it would fight with the combat AI).
  allow-during-fight: false
  # How long open-ended actions (walk, run, spin, follow, ...) run when no for=<time> is given.
  default-duration: 10s

# "Life" mode makes NPCs behave like players on an SMP while nothing else controls them (no fight, mass action or path):
# they wander near their home, look at nearby players, fidget (jump, sneak, swing) and, with the ai: section on, chat.
# Turn it on per NPC with /npc life <targets> on, or for every new NPC with default-for-new-npcs.
life:
  enabled: true
  default-for-new-npcs: false
  # Life NPCs can be hurt and killed like players in survival (they respawn at home after npc.idle-respawn-delay-seconds)
  # and never fight back on their own. false = they stay invulnerable outside fights like other NPCs.
  vulnerable: true
  wander-radius: 10
  wander-min-distance: 3
  look-radius: 8
  decision-min-seconds: 3
  decision-max-seconds: 10
  # How likely each thing is when an NPC decides what to do next (relative numbers).
  weights:
    wander: 40
    idle: 30
    look-around: 15
    jump: 5
    sneak: 5
    swing: 5

# AI chat: NPCs in life mode answer player chat, with replies written by Claude (official Anthropic SDK).
# Off by default. It needs an API key: put it in the ANTHROPIC_API_KEY environment variable (best), or below.
# An NPC answers when its name is in the message, or when it is the nearest life NPC within hear-radius.
# Every answer is an API call that costs money, so the limits below matter. Players can always ask the NPC whether it
# is an AI and it will say so. Try it without chatting: /npc ask <id> <message> (works from the console).
ai:
  enabled: false
  api-key: ''
  # Leave empty for the official API. Set it to use a proxy or a gateway.
  base-url: ''
  # Any Claude model id. claude-haiku-4-5 is much cheaper and faster (set effort to none for it).
  model: claude-opus-5-5
  # low, medium, high, xhigh, max, or none to send no effort setting (Haiku 4.5 and older Sonnets reject it).
  effort: low
  max-tokens: 1024
  timeout-seconds: 30
  hear-radius: 12
  mention-radius: 48
  # Chance that the nearest NPC answers a message that does not name anyone.
  reply-chance: 0.8
  npc-cooldown-seconds: 6
  player-cooldown-seconds: 3
  # Requests running at the same time; more messages are ignored until one finishes.
  max-concurrent: 2
  # Lines of conversation each NPC remembers.
  memory-turns: 8
  # ALL = everyone sees the reply, NEARBY = players within reply-radius.
  reply-scope: ALL
  reply-radius: 48
  max-chars: 200
  # Replies appear after a short "typing" delay of this many ticks per character (at most 5 seconds).
  typing-ticks-per-char: 1.0
  format: '<{name}> {message}'
  # Default personality for every NPC (override per NPC with /npc persona <id> <text>).
  persona: 'You are friendly and a bit sarcastic, and you like mining, building and exploring.'

# Routes (/npc path): waypoint sequences NPCs walk, optionally ending in a fight.
routes:
  # An NPC that cannot reach a waypoint within this time skips it, so a stuck NPC never blocks the sequence.
  waypoint-timeout-seconds: 30

# Random names and skins. The pools live in pools.yml (edit it, or use /npc pool).
appearance:
  # /npc spawn and spawnmany give each NPC a random name and skin unless you set them (name, skin=<player>).
  random-on-spawn: true

# Downloads missing optional plugins into the plugins folder when the server starts. They load on the NEXT restart.
# Sources: Citizens from its own build server (ci.citizensnpcs.co, no API key exists), EssentialsX (the kit plugin)
# from Modrinth (SHA-512 verified). Only those hosts are accepted, jars are checked to really be that plugin, and
# an existing plugin or file is never replaced. Set enabled: false to turn it all off; /npc deps install still works.
auto-download:
  enabled: true
  on-startup: true
  plugins:
    # Off by default: Citizens' newest build may not support your Minecraft version (it then disables itself but still
    # owns /npc), and when it works it takes /npc from NPC-Wars (use /npcwars then). Only needed for /npc import citizens.
    citizens: false
    essentialsx: true

kits:
  # Applying a kit removes whatever else the NPC wears. false = only the slots the kit fills are replaced.
  clear-before-apply: true

# All texts use MiniMessage (https://docs.advntr.dev/minimessage/format.html). <prefix> is the prefix below.
# Team names never appear in any of these in-game messages; only the admin commands /npc team list|info show them.
messages:
  prefix: '<dark_gray>[<gold>NPC-Wars<dark_gray>]<reset> '

  general:
    no-permission: '<prefix><red>You do not have permission to do that.'
    players-only: '<prefix><red>This can only be used by a player in game.'
    unknown-subcommand: '<prefix><red>Unknown sub-command <white><input><red>. Use <white>/<label> help<red>.'
    usage: '<prefix><red>Usage: <white><usage>'
    invalid-page: '<prefix><red><input> is not a valid page (1-<pages>).'
    reloaded: '<prefix><green>Configuration and kits reloaded.'
    saved: '<prefix><green>data.yml saved.'

  help:
    header: '<prefix><gold>/<label> <gray>- page <page>/<pages>'
    entry: '<yellow><usage> <gray>- <description>'

  action:
    bad-argument: '<prefix><red>"<argument>" is not valid for the <white><action><red> action.'
    missing-argument: '<prefix><red>The <white><action><red> action needs more arguments: <white><usage>'
    need-player-in-world: '<prefix><red>"<direction>" needs you to be a player in the same world as the NPCs.'
    player-offline: '<prefix><red>Player <white><player><red> is not online.'

  npc:
    spawned: '<prefix><green>Spawned NPC <white>#<id><green>. Shift + Right-click it to equip it.'
    spawned-many: '<prefix><green>Spawned <white><count><green> NPCs.'
    invalid-count: '<prefix><red>"<input>" is not a valid count (1-<max>).'
    invalid-radius: '<prefix><red>"<input>" is not a valid radius (1-<max>).'
    limit-reached: '<prefix><red>NPC limit reached (<max>). Raise npc.max-npcs in config.yml.'
    removed: '<prefix><green>Removed <white><count><green> NPC(s).'
    use-removeall: '<prefix><red>To delete every NPC use <white>/<label> removeall confirm<red>.'
    removeall-confirm: '<prefix><red>This deletes all <white><count><red> NPCs. Run <white>/<label> removeall confirm<red> to continue.'
    list-header: '<prefix><gold><count> NPC(s) <gray>- page <page>/<pages>'
    list-entry: '<yellow>#<id> <white><label> <gray>team <white><team> <gray>[<state>] <location>'
    info: '<prefix><gold>NPC #<id> <gray>(<label>)<newline><gray>State: <white><state><newline><gray>Team: <white><team><newline><gray>Position: <white><location><newline><gray>Skin: <white><skin><newline><gray>Equipped slots: <white><equipment>'
    not-spawned: '<prefix><red>NPC #<id> is not spawned right now (its chunk or world is not loaded).'
    teleported: '<prefix><green>Teleported to NPC #<id>.'
    brought: '<prefix><green>Moved <white><count><green> NPC(s) to you.'
    selection-cleared: '<prefix><green>Selection cleared.'
    selection-list: '<prefix><gray>Selected (<count>): <white><ids>'
    selected: '<prefix><green><count> NPC(s) selected. <gray>/kitall now applies kits to them.'
