name: NPC-Wars
main: com.npcwars.NpcWarsPlugin
version: '${project.version}'
api-version: '1.21.9'
description: Equippable player-like NPCs with kits, mass actions, numbered teams and team fights.
authors: [qItzblue]
softdepend: [Essentials, CMI, Citizens]

commands:
  npc:
    description: Manage NPCs, teams and fights.
    usage: /<command> help
    aliases: [npcwars]
    permission: npcplugin.use
    permission-message: '§cYou do not have permission to use this command.'
  kitall:
    description: Open the combined kit menu (EssentialsX, CMI and built-in kits) and apply a kit to NPCs.
    usage: /<command> [all|selected|team <n>]
    permission: npcplugin.kit
    permission-message: '§cYou do not have permission to use this command.'
  massaction:
    description: Make many NPCs perform the same action at once.
    usage: /<command> <action> [args...] [for=<time>] [team=<n>] [npc=<ids>]
    aliases: [mass]
    permission: npcplugin.massaction
    permission-message: '§cYou do not have permission to use this command.'

permissions:
  npcplugin.admin:
    description: Full access to every NPC-Wars feature.
    default: op
    children:
      npcplugin.use: true
      npcplugin.npc: true
      npcplugin.equip: true
      npcplugin.team: true
      npcplugin.fight: true
      npcplugin.kit: true
      npcplugin.massaction: true
      npcplugin.reload: true
      npcplugin.notify: true
      npcplugin.debug: true
      npcplugin.deps: true
      npcplugin.import: true
      npcplugin.route: true
  npcplugin.use:
    description: Use the /npc command (help and read-only subcommands such as list and info).
    default: false
  npcplugin.npc:
    description: Spawn, remove, move, rename, skin and select NPCs.
    default: false
    children:
      npcplugin.use: true
  npcplugin.equip:
    description: Open the equipment GUI (Shift + Right-click an NPC, or /npc equip).
    default: false
    children:
      npcplugin.use: true
  npcplugin.team:
    description: Manage teams (/npc team ...).
    default: false
    children:
      npcplugin.use: true
  npcplugin.fight:
    description: Start, schedule and stop fights (/npc fight, /npc timefight, /npc stopfight).
    default: false
    children:
      npcplugin.use: true
  npcplugin.kit:
    description: Use /kitall and manage built-in kits (/npc kit ...).
    default: false
    children:
      npcplugin.use: true
  npcplugin.massaction:
    description: Use /massaction.
    default: false
  npcplugin.reload:
    description: Reload the configuration (/npc reload, /npc save).
    default: false
    children:
      npcplugin.use: true
  npcplugin.notify:
    description: Receive fight countdown and result announcements when fight.announce is STAFF.
    default: false
  npcplugin.debug:
    description: Use /npc debug.
    default: false
    children:
      npcplugin.use: true
  npcplugin.deps:
    description: Download the optional plugins Citizens and EssentialsX (/npc deps).
    default: false
    children:
      npcplugin.use: true
  npcplugin.import:
    description: Import NPCs from Citizens (/npc import citizens).
    default: false
    children:
      npcplugin.use: true
  npcplugin.route:
    description: Build routes and send NPCs along them (/npc path).
    default: false
    children:
      npcplugin.use: true
